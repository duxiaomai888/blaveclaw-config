# Ruff 配置 — 只开零误报、高价值的规则(秒级、0 依赖)。
# 不开全量 E/F 风格规则:本项目中文注释 + 警示性长行是刻意的工程纪律,
# 行长(E501)/空行(E302)这类风格规则会刷出大量与本意无关的改动。
[tool.ruff]
# 只扫项目自身代码;vendor/ 是内嵌第三方(缠论框架),archive/ 是历史快照,
# .venv/ 是虚拟环境 —— 都不该被 lint。
extend-exclude = ["vendor", "archive", ".venv", "tmp", "cache"]

[tool.ruff.lint]
# F401 = 未使用 import;F811 = 重复定义;E9 = 语法/运行时致命错误(未闭合括号等)。
# 这三条是"错一点全盘皆输"的真正信号源,其余规则在此项目收益低于噪音。
select = ["F401", "F811", "E9"]
# F401 对 __init__ 重导出、_bootstrap 占位 import 是合法的 —— 逐处 noqa 更清楚。
