name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt scipy
      - name: Run checks (self-contained scripts, no network)
        run: |
          set -e
          for t in tests/check_*.py; do
            echo "=== $t ==="
            python "$t"
          done
      - name: Check core scripts parse
        run: |
          set -e
          for s in core/single_symbol_backtest.py core/run_batch.py core/coin_screener.py core/validate_strategy.py; do
            echo "=== $s ==="
            python -c "import ast; ast.parse(open('$s').read())"
          done
